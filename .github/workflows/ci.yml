name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # macos-26 (arm64) ships Xcode 26.x. The code targets that Swift floor, so
    # Swift features newer than the image's default Xcode stay out until it moves.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install xcodegen swiftlint
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Build
        run: make build
