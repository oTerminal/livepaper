name: Livepaper

options:
  bundleIdPrefix: app.livepaper
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

# The wallpaper extension, the render host (record 0001), lives in its own file so
# that it stays one include away from being left out.
include:
  - path: targets/extension.yml
    relativePaths: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # No paid Apple Developer account: local builds are ad-hoc signed. Release
    # signing (self-signed certificate) is set up in M9 once ADR-0004 is written.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO

packages:
  LivepaperKit:
    path: Packages/LivepaperKit
  DesignSystem:
    path: Packages/DesignSystem

targets:
  Livepaper:
    type: application
    platform: macOS
    sources: [App]
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.livepaper.Livepaper
        GENERATE_INFOPLIST_FILE: YES
        # The display name lives here and nowhere else.
        INFOPLIST_KEY_CFBundleDisplayName: Livepaper
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "MIT License. Livepaper contributors."
        ENABLE_APP_SANDBOX: NO
        # Off on purpose, whatever Xcode's default becomes: codesign writes a
        # temporary file beside the helper it signs, which a sandboxed script
        # may not (tried with it on: "Write permissions error").
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - package: LivepaperKit
        product: LivepaperCore
      - package: LivepaperKit
        product: LivepaperImport
      - package: LivepaperKit
        product: LivepaperPlayback
      - package: LivepaperKit
        product: LivepaperSystem
      # The fakes run (-fakes YES) builds the screens on its fakes.
      - package: LivepaperKit
        product: LivepaperTestSupport
      - package: DesignSystem
      # Embedded in Contents/Extensions, where ExtensionKit finds it.
      - target: WallpaperExtension
    postBuildScripts:
      # The ffmpeg helper (record 0006) goes next to the app's executable, where
      # Bundle.main.url(forAuxiliaryExecutable:) finds it, signed on its own before
      # Xcode signs the app, which seals it. It is there when `make ffmpeg` built it
      # or CI fetched it; without it the build goes on, and the files only ffmpeg can
      # open fail to import with `helperMissing`. A helper that goes is taken out of
      # the bundle at the next build.
      - name: Bundle the ffmpeg helper
        basedOnDependencyAnalysis: true
        inputFiles:
          - $(SRCROOT)/Helpers/ffmpeg/out/ffmpeg
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_FOLDER_PATH)/ffmpeg
        script: |
          set -eu
          if [ -f "$SCRIPT_INPUT_FILE_0" ]; then
            ditto "$SCRIPT_INPUT_FILE_0" "$SCRIPT_OUTPUT_FILE_0"
            codesign --force --sign - --identifier "$PRODUCT_BUNDLE_IDENTIFIER.ffmpeg" --timestamp=none "$SCRIPT_OUTPUT_FILE_0"
          else
            rm -f "$SCRIPT_OUTPUT_FILE_0"
            echo "note: no ffmpeg helper at $SCRIPT_INPUT_FILE_0; the app is built without it (make ffmpeg)"
          fi

  Gallery:
    type: application
    platform: macOS
    sources: [Gallery]
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.livepaper.Gallery
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Livepaper Gallery
        ENABLE_APP_SANDBOX: NO
    dependencies:
      - package: DesignSystem

  livepaper-cli:
    type: tool
    platform: macOS
    sources: [CLI]
    scheme: {}
    settings:
      base:
        PRODUCT_NAME: livepaper
        # Without this the module would be "livepaper", which collides with the
        # app's "Livepaper" module on a case-insensitive disk.
        PRODUCT_MODULE_NAME: LivepaperCLI
        PRODUCT_BUNDLE_IDENTIFIER: app.livepaper.cli
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
